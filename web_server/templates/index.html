<!DOCTYPE html>
<html>
<head>
    <title>e-Paper 圖片助理</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f4; margin: 0; }
        .container { max-width: 600px; margin: 20px auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #333; font-size: 1.5em; }
        
        .upload-box { border: 2px dashed #007bff; padding: 30px; border-radius: 10px; background: #fff; margin-bottom: 20px; }
        
        .btn { display: inline-block; padding: 12px 24px; margin: 5px; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; }
        .btn-primary { background: #007bff; color: white; }
        .btn-success { background: #28a745; color: white; width: 100%; }
        .btn-secondary { background: #6c757d; color: white; }
        
        #previewImg { width: 100%; border: 1px solid #ddd; border-radius: 5px; margin: 15px 0; }
        .loader { display: none; border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status-msg { margin: 10px 0; font-weight: bold; font-size: 0.9em; }
        
        .result-area { display: none; margin-top: 20px; border-top: 2px solid #eee; padding-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>電子紙圖片助手</h1>
        
        <div class="upload-box">
            <p>1. 選擇一張照片</p>
            <input type="file" id="fileInput" accept="image/*" style="margin-bottom: 10px;"><br>
            <button id="uploadBtn" class="btn btn-primary">2. 開始轉換圖片</button>
        </div>
        
        <div id="status" class="status-msg"></div>
        <div id="loader" class="loader"></div>

        <div id="resultArea" class="result-area">
            <h3>轉換預覽</h3>
            <img id="previewImg" src="">
            <button id="pushBtn" class="btn btn-success">3. 推送至電子紙螢幕</button>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const pushBtn = document.getElementById('pushBtn');
        const status = document.getElementById('status');
        const loader = document.getElementById('loader');
        const resultArea = document.getElementById('resultArea');
        const previewImg = document.getElementById('previewImg');

        let currentFile = '';

        uploadBtn.onclick = async () => {
            if (fileInput.files.length === 0) {
                alert('請先選擇圖片檔案');
                return;
            }

            const file = fileInput.files[0];
            if (file.size > 10 * 1024 * 1024) {
                alert('圖片太大（超過 10MB），請選擇較小的檔案');
                return;
            }

            status.textContent = '正在上傳並處理中，請稍候...';
            status.style.color = '#333';
            loader.style.display = 'block';
            uploadBtn.disabled = true;
            resultArea.style.display = 'none';

            const formData = new FormData();
            formData.append('file', file);

            try {
                console.log('開始 Fetch Upload...');
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error || '伺服器錯誤');
                }

                const data = await response.json();
                currentFile = data.preview;
                previewImg.src = data.preview_url + '?t=' + new Date().getTime();
                resultArea.style.display = 'block';
                status.textContent = '轉換成功！';
                status.style.color = 'green';
            } catch (e) {
                alert('失敗: ' + e.message);
                status.textContent = '失敗: ' + e.message;
                status.style.color = 'red';
            } finally {
                loader.style.display = 'none';
                uploadBtn.disabled = false;
            }
        };

        pushBtn.onclick = async () => {
            if (!currentFile) return;
            
            if (!confirm('確認推送至電子紙？螢幕會閃爍約 15 秒。')) return;

            status.textContent = '正在通訊更新中...';
            status.style.color = '#333';
            loader.style.display = 'block';
            pushBtn.disabled = true;

            try {
                const response = await fetch('/display/' + currentFile);
                const data = await response.json();
                if (response.ok) {
                    alert('✅ ' + data.message);
                    status.textContent = '✅ 已完成更新';
                } else {
                    throw new Error(data.error || '推送失敗');
                }
            } catch (e) {
                alert('錯誤: ' + e.message);
                status.textContent = '❌ ' + e.message;
            } finally {
                loader.style.display = 'none';
                pushBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
