<!DOCTYPE html>
<html>
<head>
    <title>圖片預覽</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f4; }
        .preview-container { background: white; padding: 20px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 90%; }
        img { max-width: 100%; border: 1px solid #ccc; margin: 10px 0; }
        .btn { display: inline-block; padding: 12px 24px; margin: 10px; border-radius: 5px; text-decoration: none; font-weight: bold; }
        .btn-push { background: #28a745; color: white; }
        .btn-back { background: #6c757d; color: white; }
        h2 { color: #333; }
        .info { font-size: 0.9em; color: #666; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="preview-container">
        <h2>影像轉換預覽</h2>
        <p class="info">下方顯示的是模擬電子紙 (800x480, 7色) 抖動演算法後的結果</p>
        
        <div>
            <img src="/static/uploads/{{ preview }}" alt="Preview">
        </div>

        <a href="/display/{{ preview }}" class="btn btn-push" onclick="return confirm('確定要將此影像推送到電子紙嗎？（刷新約需數秒）')">確認推送至電子紙</a>
        <br>
        <a href="/" class="btn btn-back">重新上傳</a>
    </div>
</body>
</html>
